<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajay Rao</title>
<style>
  :root{
    --bg:#0b0f14;
    --card:#131a22;
    --text:#e8edf2;
    --muted:#8a97a6;
    --accent:#2dd4bf;
    --border:#1f2a35;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #16202b 0%, var(--bg) 55%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{width:100%;max-width:560px;text-align:center}
  .avatar{
    width:96px;height:96px;border-radius:50%;
    margin:0 auto 20px;
    background:linear-gradient(135deg,var(--accent),#3b82f6);
    display:flex;align-items:center;justify-content:center;
    font-size:38px;font-weight:700;color:#06211d;
    box-shadow:0 10px 40px rgba(45,212,191,.25);
  }
  h1{font-size:28px;letter-spacing:.3px;margin-bottom:6px}
  .role{color:var(--accent);font-weight:600;font-size:15px;margin-bottom:10px}
  .bio{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:28px}
  .links{display:flex;flex-direction:column;gap:12px}
  a.link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:15px 18px;
    text-decoration:none;color:var(--text);
    font-size:16px;font-weight:600;
    transition:transform .12s ease,border-color .12s ease,background .12s ease;
  }
  a.link:hover{transform:translateY(-2px);border-color:var(--accent);background:#17212b}
  .ic{
    width:34px;height:34px;flex:0 0 34px;border-radius:9px;
    background:#0e151d;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700;color:var(--accent);
  }
  .link .txt{flex:1;text-align:left}
  .link .sub{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
  .arrow{color:var(--muted);font-size:18px}
  footer{margin-top:30px;color:var(--muted);font-size:12px}
  @media(max-width:480px){h1{font-size:24px}}
</style>
</head>
<body>
  <main class="wrap">
    <div class="avatar">AR</div>
    <h1>Ajay Rao</h1>
    <div class="role">Computer Science @ SDSU · Cloud &amp; AI</div>
    <p class="bio">CS student building toward Cloud AI Engineering. AWS Certified Cloud Practitioner. Into cloud, DevOps, and cybersecurity.</p>

    <nav class="links">
      <a class="link" href="https://www.linkedin.com/in/ajay-rao-145170290" target="_blank" rel="noopener">
        <span class="ic">in</span>
        <span class="txt">LinkedIn<span class="sub">Connect with me professionally</span></span>
        <span class="arrow">&rsaquo;</span>
      </a>
      <a class="link" href="https://github.com/Ajay43634" target="_blank" rel="noopener">
        <span class="ic">&lt;/&gt;</span>
        <span class="txt">GitHub<span class="sub">See my projects and code</span></span>
        <span class="arrow">&rsaquo;</span>
      </a>
      <a class="link" href="https://instagram.com/ajay4263" target="_blank" rel="noopener">
        <span class="ic">◎</span>
        <span class="txt">Instagram<span class="sub">@ajay4263</span></span>
        <span class="arrow">&rsaquo;</span>
      </a>
    </nav>

    <footer>© 2026 Ajay Rao</footer>
  </main>
</body>
</html>
